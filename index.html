<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>🐦 비둘기와 스터디콜</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  background: #151619;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    sans-serif;
}

body {
  color: white;
}


/* =================================
   전체 앱
================================= */

.app {

  width: 100%;
  height: 100dvh;

  max-width: 480px;

  margin: 0 auto;

  position: relative;

  overflow: hidden;

  background: #1b1c20;
}


/* =================================
   비둘기 화면
================================= */

.pigeon-screen {

  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 35%;

  background:
    linear-gradient(
      145deg,
      #edf3f8,
      #d9e4ed
    );

  overflow: hidden;

  z-index: 1;
}


/* 위쪽 제목 */

.call-header {

  position: absolute;

  top: 42px;
  left: 25px;
  right: 25px;

  display: flex;

  justify-content: space-between;
  align-items: center;

  z-index: 20;

  font-size: 17px;

  font-weight: 700;
}

.call-title {

  display: flex;

  align-items: center;

  gap: 8px;
}

.red-dot {

  width: 12px;
  height: 12px;

  border-radius: 50%;

  background: #ff4f73;
}

.call-time {

  font-size: 14px;

  font-weight: 500;

  opacity: .75;
}


/* 창문 */

.window {

  position: absolute;

  right: 55px;
  top: 90px;

  width: 105px;
  height: 105px;

  border-radius: 17px;

  background: #afd0e2;

  opacity: .8;

  overflow: hidden;
}

.window::before {

  content: "";

  position: absolute;

  left: 50%;
  top: 0;

  width: 5px;
  height: 100%;

  transform: translateX(-50%);

  background: rgba(255,255,255,.7);
}

.window::after {

  content: "";

  position: absolute;

  left: 0;
  top: 50%;

  width: 100%;
  height: 5px;

  transform: translateY(-50%);

  background: rgba(255,255,255,.7);
}


/* 비둘기 */

.pigeon {

  position: absolute;

  left: 50%;
  top: 61%;

  transform:
    translate(-50%, -50%);

  font-size: 105px;

  filter:
    drop-shadow(
      0 12px 12px rgba(0,0,0,.15)
    );

  z-index: 10;

  animation:
    pigeonFloat 3s ease-in-out infinite;
}

@keyframes pigeonFloat {

  0%,100% {

    transform:
      translate(-50%, -50%)
      translateY(0);

  }

  50% {

    transform:
      translate(-50%, -50%)
      translateY(-5px);

  }
}


/* 비둘기 상태 */

.pigeon-status {

  position: absolute;

  left: 25px;
  bottom: 14px;

  padding: 9px 15px;

  border-radius: 13px;

  background:
    rgba(70,70,70,.55);

  backdrop-filter:
    blur(8px);

  font-size: 13px;

  z-index: 20;
}


/* =================================
   내 카메라
================================= */

.my-video {

  position: absolute;

  left: 18px;
  right: 18px;

  top: 33%;

  height: 21%;

  border-radius: 23px;

  overflow: hidden;

  background: #111;

  border:
    2px solid
    rgba(255,255,255,.16);

  box-shadow:
    0 10px 25px
    rgba(0,0,0,.35);

  z-index: 10;
}

#camera {

  width: 100%;
  height: 100%;

  object-fit: cover;

  transform: scaleX(-1);

  display: block;

  background: #111;
}

.camera-label {

  position: absolute;

  left: 14px;
  bottom: 12px;

  padding: 7px 11px;

  border-radius: 11px;

  background:
    rgba(30,30,30,.7);

  backdrop-filter:
    blur(7px);

  font-size: 12px;

  z-index: 5;
}


/* =================================
   컨트롤 영역
================================= */

.control-area {

  position: absolute;

  left: 0;
  right: 0;

  bottom: 0;

  height: 47%;

  padding:
    13px
    18px
    86px;

  background: #1b1c20;

  z-index: 30;

  overflow: hidden;
}


/* =================================
   공부시간 카드
================================= */

.study-card {

  width: 100%;

  padding:
    14px
    15px
    13px;

  border-radius: 21px;

  background: #1d1e22;

  border:
    1px solid
    rgba(255,255,255,.09);

  box-shadow:
    0 7px 20px
    rgba(0,0,0,.2);

  text-align: center;
}

.study-top {

  display: flex;

  justify-content: space-between;
  align-items: center;

  color: #aeb0b7;

  font-size: 14px;
}

.study-state {

  color: #83c9ff;
}

.timer {

  margin:
    4px 0
    10px;

  font-size: 38px;

  font-weight: 800;

  letter-spacing: 1px;

  color: white;
}


/* 공부 버튼 */

.study-buttons {

  display: grid;

  grid-template-columns:
    1.2fr 1fr 1fr;

  gap: 7px;
}

.study-buttons button {

  border: none;

  border-radius: 14px;

  padding: 11px 4px;

  font-size: 12px;

  font-weight: 700;

  background: #303136;

  color: white;

  white-space: nowrap;
}

.study-buttons button:active {

  transform: scale(.96);
}

.start-btn {

  background: white !important;

  color: #151515 !important;
}


/* =================================
   백색 소음 카드
================================= */

.noise-card {

  margin-top: 9px;

  width: 100%;

  padding:
    11px 14px;

  border-radius: 18px;

  background: #24252a;

  border:
    1px solid
    rgba(255,255,255,.08);
}

.noise-row {

  display: flex;

  align-items: center;

  justify-content: space-between;
}

.noise-name {

  font-size: 14px;

  font-weight: 700;
}

.noise-toggle {

  border: none;

  padding:
    7px 13px;

  border-radius: 12px;

  background: #33343a;

  color: white;

  font-size: 12px;

  font-weight: 700;
}

.noise-toggle.on {

  background: white;

  color: #222;
}


/* 음량 */

.volume-row {

  display: flex;

  align-items: center;

  gap: 8px;

  margin-top: 8px;

  color: #aaa;

  font-size: 12px;
}

#volume {

  flex: 1;

  height: 4px;

  accent-color: white;
}

.volume-number {

  width: 32px;

  text-align: right;

  color: #ddd;
}


/* =================================
   하단 버튼
================================= */

.bottom-buttons {

  position: absolute;

  left: 0;
  right: 0;

  bottom: 0;

  height: 70px;

  background: #0d0e10;

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 40px;

  z-index: 100;
}

.call-button {

  width: 52px;
  height: 52px;

  border: none;

  border-radius: 50%;

  display: flex;

  justify-content: center;
  align-items: center;

  background: #303136;

  color: white;

  font-size: 22px;
}

.call-button:active {

  transform: scale(.92);
}

.hangup {

  width: 58px;
  height: 58px;

  background: #ff4d72;

  font-size: 25px;
}


/* =================================
   작은 아이폰
================================= */

@media (max-height: 720px) {

  .call-header {

    top: 30px;

  }

  .pigeon-screen {

    height: 34%;

  }

  .pigeon {

    font-size: 88px;

  }

  .window {

    top: 65px;

    width: 85px;
    height: 85px;

  }

  .my-video {

    top: 32%;

    height: 20%;

  }

  .control-area {

    height: 48%;

    padding-bottom: 78px;

  }

  .timer {

    font-size: 32px;

  }

}


/* =================================
   아주 작은 화면
================================= */

@media (max-width: 380px) {

  .call-header {

    left: 18px;
    right: 18px;

    font-size: 15px;

  }

  .pigeon {

    font-size: 90px;

  }

  .my-video {

    left: 14px;
    right: 14px;

  }

  .control-area {

    padding-left: 13px;
    padding-right: 13px;

  }

  .study-buttons button {

    font-size: 11px;

  }

  .timer {

    font-size: 30px;

  }

}

</style>
</head>


<body>

<div class="app">


  <!-- =========================
       비둘기
  ========================== -->

  <section class="pigeon-screen">

    <div class="call-header">

      <div class="call-title">

        <span class="red-dot"></span>

        <span>
          🐦 비둘기와 스터디콜
        </span>

      </div>

      <span
        class="call-time"
        id="callTime">
        00:00
      </span>

    </div>


    <div class="window"></div>


    <div class="pigeon">
      🐦
    </div>


    <div class="pigeon-status">
      🐦 비둘기 · 공부 중
    </div>

  </section>



  <!-- =========================
       내 카메라
  ========================== -->

  <div class="my-video">

    <video
      id="camera"
      autoplay
      playsinline
      muted>
    </video>

    <div class="camera-label">
      도하 · 공부 중
    </div>

  </div>



  <!-- =========================
       공부 + 백색소음
  ========================== -->

  <section class="control-area">


    <!-- 공부시간 -->

    <div class="study-card">

      <div class="study-top">

        <span>
          ⏱️ 공부시간
        </span>

        <span
          class="study-state"
          id="studyState">
          준비
        </span>

      </div>


      <div
        class="timer"
        id="studyTimer">
        00:00:00
      </div>


      <div class="study-buttons">

        <button
          class="start-btn"
          id="startBtn">
          ▶ 공부 시작
        </button>

        <button id="pauseBtn">
          ⏸ 일시정지
        </button>

        <button id="resetBtn">
          🔄 초기화
        </button>

      </div>

    </div>



    <!-- 백색소음 -->

    <div class="noise-card">

      <div class="noise-row">

        <span class="noise-name">
          🎧 백색 소음
        </span>

        <button
          class="noise-toggle"
          id="noiseBtn">
          🔇 OFF
        </button>

      </div>


      <div class="volume-row">

        <span>
          🔉
        </span>

        <input
          type="range"
          id="volume"
          min="0"
          max="100"
          value="10">

        <span
          class="volume-number"
          id="volumeNumber">
          10%
        </span>

      </div>

    </div>


  </section>



  <!-- =========================
       하단 버튼
  ========================== -->

  <div class="bottom-buttons">

    <button
      class="call-button"
      id="cameraButton">
      📷
    </button>


    <button
      class="call-button hangup"
      id="hangupButton">
      📞
    </button>


    <button
      class="call-button"
      id="noiseBottomButton">
      🔇
    </button>

  </div>


</div>



<script>


/* =================================
   카메라
================================= */

const camera =
  document.getElementById("camera");


async function startCamera() {

  try {

    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: true,

          audio: false

        });


    camera.srcObject =
      stream;


    camera.onloadedmetadata =
      () => {

        camera.play();

      };


  } catch(error) {

    console.log(
      "카메라 오류:",
      error
    );

  }

}


startCamera();



/* =================================
   통화 시간
================================= */

let callSeconds = 0;


setInterval(() => {

  callSeconds++;


  const minutes =
    Math.floor(
      callSeconds / 60
    );


  const seconds =
    callSeconds % 60;


  document
    .getElementById("callTime")
    .textContent =

      String(minutes)
        .padStart(2, "0")

      + ":"

      + String(seconds)
        .padStart(2, "0");


}, 1000);



/* =================================
   공부시간
================================= */

let studySeconds =
  Number(
    localStorage.getItem(
      "studySeconds"
    ) || 0
  );


let studyRunning = false;

let studyInterval = null;


const timer =
  document.getElementById(
    "studyTimer"
  );


const studyState =
  document.getElementById(
    "studyState"
  );


function updateTimer() {


  const hours =
    Math.floor(
      studySeconds / 3600
    );


  const minutes =
    Math.floor(
      (studySeconds % 3600) / 60
    );


  const seconds =
    studySeconds % 60;


  timer.textContent =

    String(hours)
      .padStart(2, "0")

    + ":"

    + String(minutes)
      .padStart(2, "0")

    + ":"

    + String(seconds)
      .padStart(2, "0");


  localStorage.setItem(
    "studySeconds",
    studySeconds
  );

}


updateTimer();



/* 공부 시작 */

document
  .getElementById("startBtn")
  .addEventListener(
    "click",
    () => {


      if (studyRunning)
        return;


      studyRunning = true;


      studyState.textContent =
        "공부 중 🔥";


      studyInterval =
        setInterval(
          () => {

            studySeconds++;

            updateTimer();

          },
          1000
        );

    }
  );



/* 일시정지 */

document
  .getElementById("pauseBtn")
  .addEventListener(
    "click",
    () => {


      studyRunning = false;


      clearInterval(
        studyInterval
      );


      studyState.textContent =
        "일시정지";

    }
  );



/* 초기화 */

document
  .getElementById("resetBtn")
  .addEventListener(
    "click",
    () => {


      studyRunning = false;


      clearInterval(
        studyInterval
      );


      studySeconds = 0;


      updateTimer();


      studyState.textContent =
        "준비";

    }
  );



/* =================================
   백색 소음
================================= */

let audioContext = null;

let noiseSource = null;

let gainNode = null;

let noiseOn = false;


const noiseButton =
  document.getElementById(
    "noiseBtn"
  );


const bottomNoiseButton =
  document.getElementById(
    "noiseBottomButton"
  );


const volumeSlider =
  document.getElementById(
    "volume"
  );


const volumeNumber =
  document.getElementById(
    "volumeNumber"
  );



/*
  최대 실제 음량을 낮게 설정

  슬라이더 100%
  → 실제 gain 0.20

  기본 10%
  → 실제 gain 0.02

  그래서 기본 소리가 훨씬 작음.
*/


function getGain() {

  return (
    Number(
      volumeSlider.value
    ) / 100
  ) * 0.20;

}



/* 백색소음 만들기 */

function createWhiteNoise() {


  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;


  audioContext =
    new AudioContext();


  const bufferSize =
    audioContext.sampleRate * 2;


  const buffer =
    audioContext.createBuffer(
      1,
      bufferSize,
      audioContext.sampleRate
    );


  const data =
    buffer.getChannelData(0);


  for (
    let i = 0;
    i < bufferSize;
    i++
  ) {

    data[i] =
      Math.random() * 2 - 1;

  }


  noiseSource =
    audioContext
      .createBufferSource();


  noiseSource.buffer =
    buffer;


  noiseSource.loop =
    true;


  gainNode =
    audioContext.createGain();


  /*
    처음에는 아주 작게
  */

  gainNode.gain.value =
    getGain();


  noiseSource.connect(
    gainNode
  );


  gainNode.connect(
    audioContext.destination
  );


  noiseSource.start();

}



/* 백색소음 ON */

async function turnNoiseOn() {


  if (!audioContext) {

    createWhiteNoise();

  }


  /*
    아이폰에서
    사용자 터치 후 재생
  */

  if (
    audioContext.state ===
    "suspended"
  ) {

    await audioContext.resume();

  }


  noiseOn = true;


  gainNode.gain.setTargetAtTime(
    getGain(),
    audioContext.currentTime,
    0.03
  );


  noiseButton.textContent =
    "🔊 ON";


  noiseButton.classList.add(
    "on"
  );


  bottomNoiseButton.textContent =
    "🔊";

}



/* 백색소음 OFF */

function turnNoiseOff() {


  noiseOn = false;


  if (
    gainNode &&
    audioContext
  ) {

    gainNode.gain.setTargetAtTime(
      0,
      audioContext.currentTime,
      0.03
    );

  }


  noiseButton.textContent =
    "🔇 OFF";


  noiseButton.classList.remove(
    "on"
  );


  bottomNoiseButton.textContent =
    "🔇";

}



/* 위쪽 버튼 */

noiseButton.addEventListener(
  "click",
  async () => {

    if (noiseOn) {

      turnNoiseOff();

    } else {

      await turnNoiseOn();

    }

  }
);



/* 아래쪽 버튼 */

bottomNoiseButton.addEventListener(
  "click",
  async () => {

    if (noiseOn) {

      turnNoiseOff();

    } else {

      await turnNoiseOn();

    }

  }
);



/* =================================
   음량 조절
================================= */

volumeSlider.addEventListener(
  "input",
  () => {


    const value =
      Number(
        volumeSlider.value
      );


    volumeNumber.textContent =
      value + "%";


    if (
      gainNode &&
      audioContext
    ) {

      const newGain =
        noiseOn
          ? getGain()
          : 0;


      gainNode.gain.setTargetAtTime(
        newGain,
        audioContext.currentTime,
        0.03
      );

    }

  }
);



/* =================================
   카메라 ON/OFF
================================= */

document
  .getElementById("cameraButton")
  .addEventListener(
    "click",
    () => {


      if (!camera.srcObject) {

        startCamera();

        return;

      }


      const tracks =
        camera.srcObject
          .getVideoTracks();


      tracks.forEach(
        track => {

          track.enabled =
            !track.enabled;

        }
      );


      const enabled =
        tracks[0]?.enabled;


      document
        .getElementById(
          "cameraButton"
        )
        .textContent =
          enabled
            ? "📷"
            : "🚫";

    }
  );



/* =================================
   통화 종료
================================= */

document
  .getElementById(
    "hangupButton"
  )
  .addEventListener(
    "click",
    () => {


      if (camera.srcObject) {

        camera.srcObject
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );

        camera.srcObject =
          null;

      }


      studyRunning =
        false;


      clearInterval(
        studyInterval
      );


      studyState.textContent =
        "통화 종료";


      if (noiseOn) {

        turnNoiseOff();

      }

    }
  );

</script>

</body>
</html>
