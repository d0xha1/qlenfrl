<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>🐦 비둘기와 스터디콜</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #151619;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    sans-serif;
}

body {
  color: white;
}


/* =========================
   전체 앱
========================= */

.app {

  width: 100%;
  height: 100dvh;

  max-width: 480px;

  margin: 0 auto;

  position: relative;

  overflow: hidden;

  background: #1b1c20;
}


/* =========================
   비둘기 화면
========================= */

.pigeon-screen {

  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 43%;

  background:
    linear-gradient(
      145deg,
      #edf3f8,
      #d9e4ed
    );

  overflow: hidden;

  z-index: 1;
}


/* 위쪽 제목 */

.call-header {

  position: absolute;

  top: 58px;
  left: 30px;
  right: 30px;

  display: flex;

  justify-content: space-between;
  align-items: center;

  z-index: 20;

  font-size: 17px;

  font-weight: 700;
}

.call-title {

  display: flex;

  align-items: center;

  gap: 8px;
}

.red-dot {

  width: 13px;
  height: 13px;

  border-radius: 50%;

  background: #ff4f73;
}

.call-time {

  font-size: 14px;

  font-weight: 500;

  opacity: .75;
}


/* 창문 */

.window {

  position: absolute;

  right: 58px;
  top: 110px;

  width: 110px;
  height: 190px;

  border-radius: 18px;

  background: #afd0e2;

  opacity: .8;

  overflow: hidden;
}

.window::before {

  content: "";

  position: absolute;

  left: 50%;
  top: 0;

  width: 6px;
  height: 100%;

  transform: translateX(-50%);

  background: rgba(255,255,255,.7);
}

.window::after {

  content: "";

  position: absolute;

  left: 0;
  top: 50%;

  width: 100%;
  height: 6px;

  transform: translateY(-50%);

  background: rgba(255,255,255,.7);
}


/* =========================
   비둘기
========================= */

.pigeon {

  position: absolute;

  left: 50%;
  top: 58%;

  transform:
    translate(-50%, -50%);

  font-size: 125px;

  filter:
    drop-shadow(
      0 15px 15px rgba(0,0,0,.15)
    );

  z-index: 10;

  animation:
    pigeonFloat 3s ease-in-out infinite;
}

@keyframes pigeonFloat {

  0%, 100% {

    transform:
      translate(-50%, -50%)
      translateY(0);

  }

  50% {

    transform:
      translate(-50%, -50%)
      translateY(-7px);

  }
}


/* 비둘기 상태 */

.pigeon-status {

  position: absolute;

  left: 32px;
  bottom: 18px;

  padding: 11px 17px;

  border-radius: 14px;

  background:
    rgba(70,70,70,.6);

  backdrop-filter:
    blur(8px);

  font-size: 14px;

  font-weight: 600;

  z-index: 20;
}


/* =========================
   내 카메라
========================= */

.my-video {

  position: absolute;

  left: 22px;
  right: 22px;

  top: 42%;

  height: 23%;

  border-radius: 24px;

  overflow: hidden;

  background: #111;

  border:
    2px solid
    rgba(255,255,255,.16);

  box-shadow:
    0 12px 30px
    rgba(0,0,0,.35);

  z-index: 20;
}

#camera {

  width: 100%;
  height: 100%;

  object-fit: cover;

  transform: scaleX(-1);

  display: block;

  background: #111;
}

.camera-label {

  position: absolute;

  left: 14px;
  bottom: 13px;

  padding: 8px 13px;

  border-radius: 12px;

  background:
    rgba(30,30,30,.7);

  backdrop-filter:
    blur(8px);

  font-size: 13px;

  z-index: 5;
}


/* =========================
   공부시간 영역
========================= */

.control-area {

  position: absolute;

  left: 0;
  right: 0;

  bottom: 0;

  height: 35%;

  padding:
    18px
    22px
    82px;

  background: #1b1c20;

  z-index: 40;
}


/* 공부 카드 */

.study-card {

  width: 100%;

  padding:
    17px
    16px
    16px;

  border-radius: 23px;

  background: #1d1e22;

  border:
    1px solid
    rgba(255,255,255,.1);

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.25);

  text-align: center;
}


/* 카드 위 */

.study-top {

  display: flex;

  justify-content: space-between;
  align-items: center;

  color: #aeb0b7;

  font-size: 15px;

  margin-bottom: 3px;
}

.study-state {

  color: #83c9ff;
}


/* 타이머 */

.timer {

  margin:
    5px 0
    13px;

  font-size: 43px;

  font-weight: 800;

  letter-spacing: 1px;

  color: white;
}


/* 버튼 */

.study-buttons {

  display: grid;

  grid-template-columns:
    1.2fr 1fr 1fr;

  gap: 9px;
}

.study-buttons button {

  border: none;

  border-radius: 15px;

  padding:
    13px
    5px;

  font-size: 13px;

  font-weight: 700;

  background: #303136;

  color: white;

  white-space: nowrap;
}

.study-buttons button:active {

  transform: scale(.96);
}

.start-btn {

  background: white !important;

  color: #151515 !important;
}


/* =========================
   하단 통화 버튼
========================= */

.bottom-buttons {

  position: absolute;

  left: 0;
  right: 0;

  bottom: 0;

  height: 72px;

  background: #0d0e10;

  display: flex;

  justify-content: center;
  align-items: center;

  gap: 42px;

  z-index: 100;
}

.call-button {

  width: 54px;
  height: 54px;

  border: none;

  border-radius: 50%;

  display: flex;

  justify-content: center;
  align-items: center;

  background: #303136;

  color: white;

  font-size: 23px;
}

.call-button:active {

  transform: scale(.92);
}

.hangup {

  width: 60px;
  height: 60px;

  background: #ff4d72;

  font-size: 26px;
}


/* =========================
   작은 화면
========================= */

@media (max-height: 720px) {

  .call-header {

    top: 35px;

  }

  .pigeon-screen {

    height: 42%;

  }

  .window {

    top: 75px;

    width: 90px;
    height: 145px;

  }

  .pigeon {

    font-size: 100px;

  }

  .my-video {

    top: 40%;

    height: 22%;

  }

  .control-area {

    height: 36%;

    padding-bottom: 78px;

  }

  .timer {

    font-size: 34px;

  }

}


/* =========================
   작은 폭
========================= */

@media (max-width: 380px) {

  .call-header {

    left: 20px;
    right: 20px;

    font-size: 15px;

  }

  .pigeon {

    font-size: 105px;

  }

  .my-video {

    left: 16px;
    right: 16px;

  }

  .control-area {

    padding-left: 15px;
    padding-right: 15px;

  }

  .study-buttons {

    gap: 6px;

  }

  .study-buttons button {

    font-size: 11px;

  }

  .timer {

    font-size: 31px;

  }

}

</style>
</head>


<body>

<div class="app">


  <!-- =========================
       비둘기 영상통화
  ========================== -->

  <section class="pigeon-screen">

    <div class="call-header">

      <div class="call-title">

        <span class="red-dot"></span>

        <span>
          🐦 비둘기와 스터디콜
        </span>

      </div>

      <span
        class="call-time"
        id="callTime">
        00:00
      </span>

    </div>


    <div class="window"></div>


    <div class="pigeon">
      🐦
    </div>


    <div class="pigeon-status">
      🐦 비둘기 · 공부 중
    </div>

  </section>



  <!-- =========================
       내 카메라
  ========================== -->

  <div class="my-video">

    <video
      id="camera"
      autoplay
      playsinline
      muted>
    </video>

    <div class="camera-label">
      도하 · 공부 중
    </div>

  </div>



  <!-- =========================
       공부시간
  ========================== -->

  <section class="control-area">

    <div class="study-card">

      <div class="study-top">

        <span>
          ⏱️ 공부시간
        </span>

        <span
          class="study-state"
          id="studyState">
          준비
        </span>

      </div>


      <div
        class="timer"
        id="studyTimer">
        00:00:00
      </div>


      <div class="study-buttons">

        <button
          class="start-btn"
          id="startBtn">
          ▶ 공부 시작
        </button>

        <button
          id="pauseBtn">
          ⏸ 일시정지
        </button>

        <button
          id="resetBtn">
          🔄 초기화
        </button>

      </div>

    </div>

  </section>



  <!-- =========================
       하단 버튼
  ========================== -->

  <div class="bottom-buttons">

    <button
      class="call-button"
      id="cameraButton">
      📷
    </button>


    <button
      class="call-button hangup"
      id="hangupButton">
      📞
    </button>


    <button
      class="call-button"
      id="speakerButton">
      🔊
    </button>

  </div>


</div>



<script>

/* =========================
   카메라
========================= */

const camera =
  document.getElementById("camera");


async function startCamera() {

  try {

    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: true,

          audio: false

        });


    camera.srcObject =
      stream;


    camera.onloadedmetadata =
      () => {

        camera.play();

      };


  } catch(error) {

    console.log(
      "카메라 오류:",
      error
    );

  }

}


startCamera();



/* =========================
   통화 시간
========================= */

let callSeconds = 0;


setInterval(() => {

  callSeconds++;


  const minutes =
    Math.floor(
      callSeconds / 60
    );


  const seconds =
    callSeconds % 60;


  document
    .getElementById("callTime")
    .textContent =

      String(minutes)
        .padStart(2, "0")

      + ":"

      + String(seconds)
        .padStart(2, "0");

}, 1000);



/* =========================
   공부시간
========================= */

let studySeconds =
  Number(
    localStorage.getItem(
      "studySeconds"
    ) || 0
  );


let studyRunning = false;

let studyInterval = null;


const timer =
  document.getElementById(
    "studyTimer"
  );


const studyState =
  document.getElementById(
    "studyState"
  );


function updateTimer() {

  const hours =
    Math.floor(
      studySeconds / 3600
    );


  const minutes =
    Math.floor(
      (studySeconds % 3600) / 60
    );


  const seconds =
    studySeconds % 60;


  timer.textContent =

    String(hours)
      .padStart(2, "0")

    + ":"

    + String(minutes)
      .padStart(2, "0")

    + ":"

    + String(seconds)
      .padStart(2, "0");


  localStorage.setItem(
    "studySeconds",
    studySeconds
  );

}


updateTimer();



/* 공부 시작 */

document
  .getElementById("startBtn")
  .addEventListener(
    "click",
    () => {

      if (studyRunning)
        return;


      studyRunning = true;


      studyState.textContent =
        "공부 중 🔥";


      studyInterval =
        setInterval(
          () => {

            studySeconds++;

            updateTimer();

          },
          1000
        );

    }
  );



/* 일시정지 */

document
  .getElementById("pauseBtn")
  .addEventListener(
    "click",
    () => {

      studyRunning = false;


      clearInterval(
        studyInterval
      );


      studyState.textContent =
        "일시정지";

    }
  );



/* 초기화 */

document
  .getElementById("resetBtn")
  .addEventListener(
    "click",
    () => {

      studyRunning = false;


      clearInterval(
        studyInterval
      );


      studySeconds = 0;


      updateTimer();


      studyState.textContent =
        "준비";

    }
  );



/* =========================
   카메라 ON / OFF
========================= */

document
  .getElementById("cameraButton")
  .addEventListener(
    "click",
    () => {

      if (!camera.srcObject) {

        startCamera();

        return;

      }


      const tracks =
        camera.srcObject
          .getVideoTracks();


      tracks.forEach(
        track => {

          track.enabled =
            !track.enabled;

        }
      );


      const enabled =
        tracks[0]?.enabled;


      document
        .getElementById(
          "cameraButton"
        )
        .textContent =
          enabled
            ? "📷"
            : "🚫";

    }
  );



/* =========================
   통화 종료
========================= */

document
  .getElementById("hangupButton")
  .addEventListener(
    "click",
    () => {

      /* 카메라 종료 */

      if (camera.srcObject) {

        camera.srcObject
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );

        camera.srcObject =
          null;

      }


      /* 공부시간 정지 */

      studyRunning = false;


      clearInterval(
        studyInterval
      );


      studyState.textContent =
        "통화 종료";

    }
  );



/* =========================
   스피커 버튼
========================= */

document
  .getElementById("speakerButton")
  .addEventListener(
    "click",
    function() {

      if (
        this.textContent === "🔊"
      ) {

        this.textContent = "🔇";

      } else {

        this.textContent = "🔊";

      }

    }
  );

</script>

</body>
</html>
