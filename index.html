<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>🐦 비둘기와 스터디콜</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #17181c;
  font-family: -apple-system, BlinkMacSystemFont,
               "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}

body {
  color: white;
}

/* 전체 화면 */
.app {
  width: 100%;
  height: 100dvh;
  max-width: 480px;
  margin: 0 auto;
  background: #1b1c20;
  position: relative;
  overflow: hidden;
}

/* =========================
   비둘기 영상통화 화면
========================= */

.pigeon-screen {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 52%;
  min-height: 390px;

  background:
    linear-gradient(
      145deg,
      #edf2f8 0%,
      #dbe5ed 55%,
      #c7d2dc 100%
    );

  overflow: hidden;
}

/* 위쪽 정보 */
.call-header {
  position: absolute;
  top: 58px;
  left: 28px;
  right: 28px;

  display: flex;
  justify-content: space-between;
  align-items: center;

  z-index: 20;

  font-size: 18px;
  font-weight: 700;
}

.call-title {
  display: flex;
  align-items: center;
  gap: 8px;
}

.red-dot {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #ff4d72;
  display: inline-block;
}

.call-time {
  font-size: 15px;
  font-weight: 500;
  opacity: .8;
}

/* 창문 */
.window {
  position: absolute;

  right: 58px;
  top: 112px;

  width: 115px;
  height: 190px;

  border-radius: 18px;

  background: #a9cee1;

  overflow: hidden;

  opacity: .8;
}

.window::before {
  content: "";

  position: absolute;

  left: 50%;
  top: 0;

  width: 6px;
  height: 100%;

  transform: translateX(-50%);

  background: rgba(255,255,255,.7);
}

.window::after {
  content: "";

  position: absolute;

  left: 0;
  top: 50%;

  width: 100%;
  height: 6px;

  transform: translateY(-50%);

  background: rgba(255,255,255,.7);
}

/* 비둘기 */
.pigeon {
  position: absolute;

  left: 50%;
  top: 51%;

  transform: translate(-50%, -50%);

  font-size: 145px;

  filter:
    drop-shadow(0 18px 15px rgba(0,0,0,.15));

  z-index: 10;

  animation: pigeonFloat 3s ease-in-out infinite;
}

@keyframes pigeonFloat {

  0%, 100% {
    transform: translate(-50%, -50%) translateY(0);
  }

  50% {
    transform: translate(-50%, -50%) translateY(-7px);
  }
}

/* 비둘기 상태 */
.pigeon-status {
  position: absolute;

  left: 32px;
  bottom: 20px;

  padding: 13px 20px;

  border-radius: 15px;

  background: rgba(70,70,70,.65);

  backdrop-filter: blur(10px);

  font-size: 15px;
  font-weight: 600;

  z-index: 20;
}

/* =========================
   내 카메라
========================= */

.my-video {
  position: absolute;

  left: 22px;
  right: 22px;

  top: 43%;

  height: 24%;

  border-radius: 25px;

  overflow: hidden;

  background: #111;

  border: 2px solid rgba(255,255,255,.18);

  box-shadow: 0 10px 30px rgba(0,0,0,.35);

  z-index: 30;
}

#camera {
  width: 100%;
  height: 100%;

  object-fit: cover;

  transform: scaleX(-1);

  display: block;

  background: #111;
}

.camera-label {
  position: absolute;

  left: 22px;
  bottom: 18px;

  padding: 10px 15px;

  border-radius: 13px;

  background: rgba(40,40,40,.7);

  backdrop-filter: blur(8px);

  font-size: 14px;

  z-index: 5;
}

/* =========================
   아래쪽 영역
========================= */

.bottom-area {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  height: 48%;

  background: #1b1c20;

  padding: 16px 22px 100px;

  z-index: 40;
}

/* 공부시간 */
.study-card {
  width: 100%;

  padding: 20px 18px 18px;

  border-radius: 24px;

  background: #1d1e22;

  border: 1px solid rgba(255,255,255,.1);

  box-shadow:
    0 10px 30px rgba(0,0,0,.25);

  text-align: center;
}

.study-top {
  display: flex;

  justify-content: space-between;
  align-items: center;

  margin-bottom: 5px;

  color: #aeb0b7;

  font-size: 15px;
}

.study-state {
  color: #83c9ff;
}

.timer {
  margin: 7px 0 14px;

  font-size: 46px;

  font-weight: 800;

  letter-spacing: 1px;

  color: white;
}

/* 공부 버튼 */
.study-buttons {
  display: grid;

  grid-template-columns: 1.2fr 1fr 1fr;

  gap: 10px;
}

.study-buttons button {
  border: none;

  border-radius: 16px;

  padding: 14px 7px;

  font-size: 14px;

  font-weight: 700;

  background: #303136;

  color: white;

  cursor: pointer;
}

.study-buttons button:active {
  transform: scale(.96);
}

.start-btn {
  background: white !important;
  color: #151515 !important;
}

/* =========================
   백색 소음
========================= */

.noise-card {
  margin-top: 13px;

  width: 100%;

  padding: 14px 17px;

  border-radius: 20px;

  background: #24252a;

  border: 1px solid rgba(255,255,255,.08);
}

.noise-row {
  display: flex;

  align-items: center;

  justify-content: space-between;
}

.noise-name {
  font-size: 15px;

  font-weight: 700;
}

.noise-toggle {
  border: none;

  padding: 9px 15px;

  border-radius: 13px;

  background: #33343a;

  color: white;

  font-weight: 700;

  font-size: 13px;
}

.noise-toggle.on {
  background: #ffffff;
  color: #222;
}

/* 음량 */
.volume-row {
  display: flex;

  align-items: center;

  gap: 10px;

  margin-top: 11px;

  color: #aaa;

  font-size: 13px;
}

.volume-icon {
  font-size: 16px;
}

#volume {
  flex: 1;

  height: 4px;

  accent-color: white;
}

.volume-number {
  width: 35px;

  text-align: right;

  color: #ddd;
}

/* =========================
   하단 통화 버튼
========================= */

.bottom-buttons {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  height: 82px;

  background: #0e0f11;

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 38px;

  z-index: 100;
}

.call-button {
  width: 62px;
  height: 62px;

  border-radius: 50%;

  border: none;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 25px;

  background: #303136;

  color: white;
}

.call-button:active {
  transform: scale(.92);
}

.hangup {
  background: #ff4d72;

  font-size: 27px;
}

/* =========================
   작은 화면
========================= */

@media (max-height: 720px) {

  .call-header {
    top: 38px;
  }

  .window {
    top: 85px;
    height: 150px;
  }

  .pigeon {
    font-size: 115px;
  }

  .pigeon-screen {
    height: 50%;
  }

  .my-video {
    top: 39%;
    height: 23%;
  }

  .bottom-area {
    height: 50%;
  }

  .timer {
    font-size: 38px;
  }
}

/* 아주 작은 아이폰 */
@media (max-width: 380px) {

  .call-header {
    left: 20px;
    right: 20px;
  }

  .pigeon {
    font-size: 110px;
  }

  .my-video {
    left: 17px;
    right: 17px;
  }

  .bottom-area {
    padding-left: 15px;
    padding-right: 15px;
  }

  .study-buttons {
    gap: 6px;
  }

  .study-buttons button {
    font-size: 12px;
  }

  .timer {
    font-size: 34px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- =========================
       비둘기 영상통화
  ========================== -->

  <section class="pigeon-screen">

    <div class="call-header">

      <div class="call-title">
        <span class="red-dot"></span>
        <span>🐦 비둘기와 스터디콜</span>
      </div>

      <span class="call-time" id="callTime">
        00:00
      </span>

    </div>

    <div class="window"></div>

    <div class="pigeon">
      🐦
    </div>

    <div class="pigeon-status">
      🐦 비둘기 · 공부 중
    </div>

  </section>


  <!-- =========================
       내 카메라
  ========================== -->

  <div class="my-video">

    <video
      id="camera"
      autoplay
      playsinline
      muted>
    </video>

    <div class="camera-label">
      도하 · 공부 중
    </div>

  </div>


  <!-- =========================
       공부시간 + 백색소음
  ========================== -->

  <section class="bottom-area">

    <div class="study-card">

      <div class="study-top">

        <span>⏱️ 공부시간</span>

        <span
          class="study-state"
          id="studyState">
          준비
        </span>

      </div>

      <div
        class="timer"
        id="studyTimer">
        00:00:00
      </div>

      <div class="study-buttons">

        <button
          class="start-btn"
          id="startBtn">
          ▶ 공부 시작
        </button>

        <button id="pauseBtn">
          ⏸ 일시정지
        </button>

        <button id="resetBtn">
          🔄 초기화
        </button>

      </div>

    </div>


    <!-- =========================
         백색 소음
    ========================== -->

    <div class="noise-card">

      <div class="noise-row">

        <span class="noise-name">
          🎧 백색 소음
        </span>

        <button
          class="noise-toggle"
          id="noiseBtn">
          🔇 OFF
        </button>

      </div>

      <div class="volume-row">

        <span class="volume-icon">
          🔉
        </span>

        <input
          type="range"
          id="volume"
          min="0"
          max="100"
          value="35">

        <span
          class="volume-number"
          id="volumeNumber">
          35%
        </span>

      </div>

    </div>

  </section>


  <!-- =========================
       하단 버튼
  ========================== -->

  <div class="bottom-buttons">

    <button
      class="call-button"
      id="cameraButton">
      📷
    </button>

    <button
      class="call-button hangup"
      id="hangupButton">
      📞
    </button>

    <button
      class="call-button"
      id="noiseBottomButton">
      🔊
    </button>

  </div>

</div>


<script>

/* ==================================
   카메라
================================== */

const camera = document.getElementById("camera");

async function startCamera() {

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });

    camera.srcObject = stream;

    camera.onloadedmetadata = () => {
      camera.play();
    };

  } catch (error) {

    console.log("카메라 오류:", error);

  }

}

startCamera();


/* ==================================
   통화 시간
================================== */

let callSeconds = 0;

setInterval(() => {

  callSeconds++;

  const minutes =
    Math.floor(callSeconds / 60);

  const seconds =
    callSeconds % 60;

  document.getElementById("callTime").textContent =
    String(minutes).padStart(2, "0")
    + ":"
    + String(seconds).padStart(2, "0");

}, 1000);


/* ==================================
   공부시간
================================== */

let studySeconds =
  Number(localStorage.getItem("studySeconds") || 0);

let studyRunning = false;
let studyInterval = null;

const timer =
  document.getElementById("studyTimer");

const studyState =
  document.getElementById("studyState");


function updateTimer() {

  const hours =
    Math.floor(studySeconds / 3600);

  const minutes =
    Math.floor((studySeconds % 3600) / 60);

  const seconds =
    studySeconds % 60;

  timer.textContent =
    String(hours).padStart(2, "0")
    + ":"
    + String(minutes).padStart(2, "0")
    + ":"
    + String(seconds).padStart(2, "0");

  localStorage.setItem(
    "studySeconds",
    studySeconds
  );

}

updateTimer();


/* 공부 시작 */

document
  .getElementById("startBtn")
  .addEventListener("click", () => {

    if (studyRunning) return;

    studyRunning = true;

    studyState.textContent =
      "공부 중 🔥";

    studyInterval =
      setInterval(() => {

        studySeconds++;

        updateTimer();

      }, 1000);

  });


/* 일시정지 */

document
  .getElementById("pauseBtn")
  .addEventListener("click", () => {

    studyRunning = false;

    clearInterval(studyInterval);

    studyState.textContent =
      "일시정지";

  });


/* 초기화 */

document
  .getElementById("resetBtn")
  .addEventListener("click", () => {

    studyRunning = false;

    clearInterval(studyInterval);

    studySeconds = 0;

    updateTimer();

    studyState.textContent =
      "준비";

  });


/* ==================================
   백색 소음
================================== */

let audioContext = null;
let noiseSource = null;
let gainNode = null;

const noiseButton =
  document.getElementById("noiseBtn");

const bottomNoiseButton =
  document.getElementById("noiseBottomButton");

const volumeSlider =
  document.getElementById("volume");

const volumeNumber =
  document.getElementById("volumeNumber");

let noiseOn = false;


/*
  백색 소음 생성
*/

function createWhiteNoise() {

  audioContext =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

  /*
    2초짜리 백색소음 버퍼 생성
  */

  const bufferSize =
    audioContext.sampleRate * 2;

  const buffer =
    audioContext.createBuffer(
      1,
      bufferSize,
      audioContext.sampleRate
    );

  const data =
    buffer.getChannelData(0);

  for (let i = 0; i < bufferSize; i++) {

    data[i] =
      Math.random() * 2 - 1;

  }


  noiseSource =
    audioContext.createBufferSource();

  noiseSource.buffer = buffer;

  noiseSource.loop = true;


  gainNode =
    audioContext.createGain();

  /*
    처음 음량 35%
  */

  gainNode.gain.value =
    Number(volumeSlider.value) / 100;


  noiseSource.connect(gainNode);

  gainNode.connect(
    audioContext.destination
  );

  noiseSource.start();

}


/* 백색소음 켜기 */

async function turnNoiseOn() {

  /*
    아이폰에서는 사용자 터치 후
    AudioContext를 실행해야 함
  */

  if (!audioContext) {

    createWhiteNoise();

  }

  if (
    audioContext.state === "suspended"
  ) {

    await audioContext.resume();

  }

  noiseOn = true;

  noiseButton.textContent =
    "🔊 ON";

  noiseButton.classList.add("on");

  bottomNoiseButton.textContent =
    "🔊";

}


/* 백색소음 끄기 */

function turnNoiseOff() {

  noiseOn = false;

  if (gainNode) {

    gainNode.gain.value = 0;

  }

  noiseButton.textContent =
    "🔇 OFF";

  noiseButton.classList.remove("on");

  bottomNoiseButton.textContent =
    "🔇";

}


/* 메인 백색소음 버튼 */

noiseButton.addEventListener(
  "click",
  async () => {

    if (noiseOn) {

      turnNoiseOff();

    } else {

      await turnNoiseOn();

    }

  }
);


/* 하단 백색소음 버튼 */

bottomNoiseButton.addEventListener(
  "click",
  async () => {

    if (noiseOn) {

      turnNoiseOff();

    } else {

      await turnNoiseOn();

    }

  }
);


/* ==================================
   음량 조절
================================== */

volumeSlider.addEventListener(
  "input",
  () => {

    const volume =
      Number(volumeSlider.value);

    volumeNumber.textContent =
      volume + "%";

    if (gainNode) {

      /*
        음량을 부드럽게 변경
      */

      gainNode.gain.value =
        volume / 100;

    }

  }
);


/* ==================================
   카메라 버튼
================================== */

document
  .getElementById("cameraButton")
  .addEventListener("click", () => {

    if (!camera.srcObject) {

      startCamera();

      return;

    }

    const tracks =
      camera.srcObject.getVideoTracks();

    tracks.forEach(track => {

      track.enabled =
        !track.enabled;

    });

    const enabled =
      tracks[0]?.enabled;

    document.getElementById(
      "cameraButton"
    ).textContent =
      enabled ? "📷" : "🚫";

  });


/* ==================================
   통화 종료 버튼
================================== */

document
  .getElementById("hangupButton")
  .addEventListener("click", () => {

    /*
      카메라 정지
    */

    if (camera.srcObject) {

      camera.srcObject
        .getTracks()
        .forEach(track => {
          track.stop();
        });

      camera.srcObject = null;

    }


    /*
      공부시간 정지
    */

    studyRunning = false;

    clearInterval(studyInterval);

    studyState.textContent =
      "통화 종료";

  });

</script>

</body>
</html>
